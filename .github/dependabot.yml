# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet: the repo's own build/test dependencies (src + tests).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns:
          - "*"

  # GitHub Actions used by the CI / CD / CodeQL workflows, and by the workflows the
  # handys11-github template ships (otherwise their action versions silently go stale).
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/src/content/github/.github/workflows"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
